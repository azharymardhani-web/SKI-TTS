    <script>
        const GRADE_MATERIALS = {
            7: ["Semua Materi", "Masa Jahiliyah", "Nabi Muhammad di Mekkah", "Nabi Muhammad di Madinah", "Khulafaur Rasyidin"],
            8: ["Semua Materi", "Dinasti Umayyah", "Dinasti Abbasiyah", "Ilmuwan Muslim"],
            9: ["Semua Materi", "Islam di Nusantara", "Wali Songo", "Kerajaan Islam di Jawa"]
        };

        const RAW_Q = `
#7|Masa Jahiliyah
Berhala terbesar yang disembah kaum Quraisy|HUBAL
Agama tauhid yang dibawa Nabi Ibrahim sebelum Islam|HANIF
Pasar tempat penyair beradu syair di Mekah|UKAZ
Tahun kelahiran Nabi Muhammad disebut tahun|GAJAH
Raja yang menyerang Ka'bah dengan pasukan gajah|ABRAHAH
Masyarakat Arab sebelum Islam disebut masyarakat|JAHILIYAH

#7|Nabi Muhammad di Mekkah
Wahyu pertama turun di gua|HIRA
Surah yang pertama kali diturunkan|ALALAQ
Istri pertama Nabi Muhammad yang sangat mendukung dakwah|KHADIJAH
Paman Nabi yang sangat memusuhi dakwahnya dan disebut dalam Al-Quran|ABULAHAB

Sahabat nabi yang menemani hijrah|ABUBAKAR
Gelar yang diberikan kepada Nabi karena dapat dipercaya|ALAMIN

#7|Nabi Muhammad di Madinah
Nama kota Madinah sebelum kedatangan Nabi|YATSRIB
Suku asli Madinah yang berseteru namun didamaikan Nabi|AUSDANKHAZRAJ
Masjid pertama yang dibangun Nabi saat tiba di Madinah|QUBA
Perang besar pertama antara umat Islam dan kafir Quraisy|BADAR
Perjanjian damai antara umat Islam dan Quraisy|HUDAIBIYAH
Kaum muslimin yang hijrah dari Mekah ke Madinah|MUHAJIRIN
Kaum muslimin Madinah yang menyambut kedatangan Nabi|ANSAR
Peristiwa penaklukan kembali kota Mekah tanpa pertumpahan darah|FATHUMAKKAH

#7|Khulafaur Rasyidin
Khalifah pertama setelah wafatnya Nabi|ABUBAKAR
Gelar Abu Bakar karena membenarkan peristiwa Isra Miraj|ASSHIDDIQ
Khalifah kedua yang membebaskan Yerusalem dan Mesir|UMAR
Gelar Umar bin Khattab yang berarti pembeda benar dan salah|ALFARUQ
Sahabat yang mengumpulkan dan membukukan mushaf Al-Quran|UTSMAN
Khalifah keempat yang merupakan menantu dan sepupu Nabi|ALI
Pusat pemerintahan Islam pada masa Khalifah Ali dipindah ke|KUFAH

#8|Dinasti Umayyah
Pendiri Dinasti Umayyah|MUAWIYAH
Pusat pemerintahan Bani Umayyah|DAMASKUS
Khalifah yang terkenal sangat adil menyerupai Khulafaur Rasyidin|UMARBINABDULAZIZ
Panglima Islam yang menaklukkan semenanjung Andalusia (Spanyol)|THARIQBINZIYAD
Gubernur Irak yang terkenal keras dan kejam pada masa Umayyah|HAJJAJ
Mata uang emas pertama yang dicetak pada masa Umayyah|DINAR

#8|Dinasti Abbasiyah
Pendiri Dinasti Bani Abbasiyah|ABULABBAS
Pusat pemerintahan Bani Abbasiyah yang megah|BAGHDAD
Khalifah yang membawa Abbasiyah pada masa kejayaan keemasan|HARUNARRASYID
Lembaga perpustakaan, terjemahan, dan pusat riset di Baghdad|BAITULHIKMAH
Dinasti Abbasiyah runtuh setelah dihancurkan oleh bangsa|MONGOL

#8|Ilmuwan Muslim
Bapak kedokteran Muslim penulis kitab Al-Qanun fi Thib|IBNUSINA
Ahli matematika penemu aljabar, algoritma dan angka nol|ALKHAWARIZMI
Filsuf dan ilmuwan yang dikenal sebagai bapak ilmu sosiologi|IBNUKHALDUN
Bapak ilmu kimia dari dunia Muslim|JABIRBINHAYYAN
Tokoh ilmu optik yang menginspirasi pembuatan kamera|IBNUHAITHAM
Filsuf besar dari Andalusia yang dikenal di Eropa sebagai Averroes|IBNURUSYD
Dokter bedah Muslim yang menemukan alat-alat bedah|ALZAHAWI

#9|Islam di Nusantara
Teori yang menyebut Islam datang dari pedagang India|GUJARAT
Teori yang menyebut Islam datang langsung dari jazirah Arab|MEKKAH
Kerajaan Islam pertama yang berdiri di Indonesia|SAMUDERAPASAI
Pendiri kerajaan Samudera Pasai|MARAHILU
Gelar raja-raja yang memimpin di Samudera Pasai|SULTAN
Kerajaan Islam pertama di pulau Jawa|DEMAK

#9|Wali Songo
Sunan yang makamnya di Gresik dan dianggap wali tertua|GRESIK

Sunan Kalijaga berdakwah secara damai menggunakan media kebudayaan|WAYANG
Sunan Gunung Jati mendirikan kesultanan di wilayah Jawa Barat|CIREBON
Sunan Kudus memiliki nama asli Ja'far|SHADIQ
Wali Songo yang berdakwah di daerah Muria|SUNANMURIA

#9|Kerajaan Islam di Jawa
Raja dan pendiri Kesultanan Demak|RADENPATAH
Kerajaan Islam yang didirikan oleh Sutawijaya di pedalaman Jawa|MATARAM
Sultan terbesar Kesultanan Mataram yang menyerang Batavia|AGUNG
Pahlawan dari Gowa Makassar yang dijuluki Ayam Jantan dari Timur|HASANUDDIN
Sultan terbesar Banten yang berani melawan monopoli VOC|AGENGTIRTAYASA
Kesultanan yang terletak di Ternate dan Tidore berada di kepulauan|MALUKU
Kerajaan Islam di Sumatra yang terkenal dengan tokoh Sultan Iskandar Muda|ACEH
`;

        let EMBEDDED_QUESTIONS = [];
        let currentK = 7, currentM = "";
        let qCounter = 1;
        
        RAW_Q.trim().split('\n').forEach(line => {
            line = line.trim();
            if (!line) return;
            if (line.startsWith('#')) {
                let parts = line.substring(1).split('|');
                currentK = parseInt(parts[0]);
                currentM = parts[1];
            } else {
                let p = line.split('|');
                if (p.length >= 2) {
                   let jawabanBersih = p[1].replace(/[^A-Za-z]/g, '').toUpperCase();
                   EMBEDDED_QUESTIONS.push({
                       id: 'SKI' + currentK + '-' + String(qCounter++).padStart(4, '0'),
                       kelas: currentK,
                       bab: 1,
                       materi: currentM,
                       pertanyaan: p[0].trim(),
                       jawaban: jawabanBersih,
                       penjelasan: "Materi " + currentM + " (Kelas " + currentK + " MTs). Jawaban historis yang tepat adalah: " + p[1].trim().toUpperCase() + ".",
                       kesulitan: (qCounter % 3 === 0) ? "Sulit" : (qCounter % 2 === 0 ? "Sedang" : "Mudah"),
                       arah: (qCounter % 2 === 0) ? "menurun" : "mendatar"
                   });
                }
            }
        });

        const State = {
            currentView: 'home',
            activeAdminTab: 'soal',
            activeLeaderboardFilter: 'ALL',
            activeResultFilter: 'ALL',
            adminQuestionPage: 1,
            adminRowsPerPage: 10,
            settings: { schoolName: "MTs Negeri 14 Jakarta", teacherName: "Bapak Guru SKI" },
            gameConfig: { studentName: '', studentClass: 'VII-A', studentNo: '', selectedSoalCount: 15, selectedTimerMin: 10 },
            activeGame: null,
            timerInterval: null,
            remainingSeconds: 600,
            score: 0,
            hintsUsed: 0,
            answersState: {},
            startTime: null,
            endTime: null,
            currentUser: null,
            cloudQuestions: JSON.parse(localStorage.getItem('ski_tts_questions_fb') || JSON.stringify(EMBEDDED_QUESTIONS)),
            cloudResults: JSON.parse(localStorage.getItem('ski_tts_results_fb') || '[]'),
            cloudTokens: JSON.parse(localStorage.getItem('ski_tts_tokens_fb') || JSON.stringify([
                { token: 'SKI7SIRAH', kelas: 7, materi: 'Nabi Muhammad di Mekkah', soalCount: 10, timer: 10, title: 'Sirah Nabawiyah Dasar' },
                { token: 'SKI8DINAS', kelas: 8, materi: 'Dinasti Abbasiyah', soalCount: 10, timer: 8, title: 'Kuis Dinasti Abbasiyah' },
                { token: 'SKI9WALI', kelas: 9, materi: 'Wali Songo', soalCount: 12, timer: 12, title: 'Evaluasi Sejarah Wali Songo' }
            ])),
            cloudUsers: JSON.parse(localStorage.getItem('ski_tts_users_fb') || JSON.stringify([
                { username: 'admin', password: 'admin123', role: 'admin', name: 'Admin Sejarah' },
                { username: 'guru_ski', password: 'guru123', role: 'teacher', name: 'Bapak/Ibu Guru SKI' }
            ])),
            availableClasses: {
                7: ['VII-A', 'VII-B', 'VII-C', 'VII-D'],
                8: ['VIII-A', 'VIII-B', 'VIII-C', 'VIII-D'],
                9: ['IX-A', 'IX-B', 'IX-C']
            },
            firebaseLoaded: false
        };

        async function syncSave(collectionName, docId, data) {
            if (collectionName === 'questions') {
                let idx = State.cloudQuestions.findIndex(q => q.id === docId);
                if (idx >= 0) State.cloudQuestions[idx] = data; else State.cloudQuestions.push(data);
                localStorage.setItem('ski_tts_questions_fb', JSON.stringify(State.cloudQuestions));
            } else if (collectionName === 'results') {
                let idx = State.cloudResults.findIndex(r => r.id === docId);
                if (idx >= 0) State.cloudResults[idx] = data; else State.cloudResults.push(data);
                localStorage.setItem('ski_tts_results_fb', JSON.stringify(State.cloudResults));
            } else if (collectionName === 'tokens') {
                let idx = State.cloudTokens.findIndex(t => t.token === docId);
                if (idx >= 0) State.cloudTokens[idx] = data; else State.cloudTokens.push(data);
                localStorage.setItem('ski_tts_tokens_fb', JSON.stringify(State.cloudTokens));
            } else if (collectionName === 'users') {
                let idx = State.cloudUsers.findIndex(u => u.username === docId);
                if (idx >= 0) State.cloudUsers[idx] = data; else State.cloudUsers.push(data);
                localStorage.setItem('ski_tts_users_fb', JSON.stringify(State.cloudUsers));
            }

            if (window.firebaseDb && window.firebaseHelpers) {
                try {
                    const docRef = window.firebaseHelpers.doc(window.firebaseDb, `ski_${collectionName}`, docId);
                    await window.firebaseHelpers.setDoc(docRef, data);
                } catch (error) {
                    console.error("Gagal sinkron Firebase:", error);
                }
            }
        }

        async function syncDelete(collectionName, docId) {
            if (collectionName === 'questions') {
                State.cloudQuestions = State.cloudQuestions.filter(q => q.id !== docId);
                localStorage.setItem('ski_tts_questions_fb', JSON.stringify(State.cloudQuestions));
            } else if (collectionName === 'results') {
                State.cloudResults = State.cloudResults.filter(r => r.id !== docId);
                localStorage.setItem('ski_tts_results_fb', JSON.stringify(State.cloudResults));
            } else if (collectionName === 'tokens') {
                State.cloudTokens = State.cloudTokens.filter(t => t.token !== docId);
                localStorage.setItem('ski_tts_tokens_fb', JSON.stringify(State.cloudTokens));
            } else if (collectionName === 'users') {
                State.cloudUsers = State.cloudUsers.filter(u => u.username !== docId);
                localStorage.setItem('ski_tts_users_fb', JSON.stringify(State.cloudUsers));
            }

            if (window.firebaseDb && window.firebaseHelpers) {
                try {
                    const docRef = window.firebaseHelpers.doc(window.firebaseDb, `ski_${collectionName}`, docId);
                    await window.firebaseHelpers.deleteDoc(docRef);
                } catch (error) {
                    console.error("Gagal hapus Firebase:", error);
                }
            }
        }

        async function loadDataFromFirebase() {
             if (window.firebaseDb && window.firebaseHelpers) {
                 try {
                     const resultsSnap = await window.firebaseHelpers.getDocs(window.firebaseHelpers.collection(window.firebaseDb, "ski_results"));
                     if(!resultsSnap.empty) {
                        let resData = [];
                        resultsSnap.forEach((doc) => resData.push(doc.data()));
                        State.cloudResults = resData;
                        localStorage.setItem('ski_tts_results_fb', JSON.stringify(resData));
                     }

                     const questionsSnap = await window.firebaseHelpers.getDocs(window.firebaseHelpers.collection(window.firebaseDb, "ski_questions"));
                     if(!questionsSnap.empty) {
                        let qData = [];
                        questionsSnap.forEach((doc) => qData.push(doc.data()));
                        State.cloudQuestions = qData;
                        localStorage.setItem('ski_tts_questions_fb', JSON.stringify(qData));
                     }

                     const tokensSnap = await window.firebaseHelpers.getDocs(window.firebaseHelpers.collection(window.firebaseDb, "ski_tokens"));
                     if(!tokensSnap.empty) {
                        let tData = [];
                        tokensSnap.forEach((doc) => tData.push(doc.data()));
                        State.cloudTokens = tData;
                        localStorage.setItem('ski_tts_tokens_fb', JSON.stringify(tData));
                     }
                     State.firebaseLoaded = true;
                     if(State.currentView === 'leaderboard' || State.currentView === 'teacherDashboard') renderApp();
                 } catch(err) {
                     console.log("Gagal memuat dari Firebase, menggunakan lokal.");
                 }
             }
        }

        function getActiveQuestions() { return State.cloudQuestions; }
        function getActiveResults() { return State.cloudResults; }
        function getActiveTokens() { return State.cloudTokens; }
        function getActiveUsers() { return State.cloudUsers; }

        const router = {
            navigate: function(viewName) {
                if (State.currentView === 'game' && viewName !== 'result') {
                    alertBox("Akses Terkunci", "Kamu sedang dalam sesi pengerjaan ujian! Selesaikan terlebih dahulu.");
                    return;
                }
                State.currentView = viewName;
                if (viewName !== 'game' && State.timerInterval) clearInterval(State.timerInterval);
                renderApp();
                window.scrollTo(0, 0);
            }
        };

        function renderApp() {
            const appEl = document.getElementById('app');
            document.getElementById('headerSchoolSub').innerText = `${State.settings.schoolName} • ${State.settings.teacherName}`;
            document.getElementById('footerSchoolIdent').innerText = `${State.settings.schoolName} • ${State.settings.teacherName}`;

            const headerNav = document.getElementById('headerNav');
            if (headerNav) headerNav.style.display = (State.currentView === 'game') ? 'none' : 'flex';

            switch(State.currentView) {
                case 'home': appEl.innerHTML = renderHomeView(); break;
                case 'leaderboard': appEl.innerHTML = renderLeaderboardView(); break;
                case 'howToPlay': appEl.innerHTML = renderHowToPlayView(); break;
                case 'setup': appEl.innerHTML = renderSetupView(); break;
                case 'game': appEl.innerHTML = renderGameView(); initGameEngine(); break;
                case 'result': appEl.innerHTML = renderResultView(); break;
                case 'teacherLogin': appEl.innerHTML = renderTeacherLoginView(); break;
                case 'teacherDashboard': appEl.innerHTML = renderTeacherDashboardView(); break;
                default: appEl.innerHTML = renderHomeView();
            }
        }

        function renderHomeView() {
            return `
                <div class="space-y-10 py-6">
                    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-brand-900 via-brand-800 to-amber-900 text-white shadow-2xl p-8 sm:p-12 md:p-16 border border-brand-700/50">
                        <div class="absolute -right-10 -bottom-10 opacity-10 text-9xl pointer-events-none">
                            <i class="fa-solid fa-scroll"></i>
                        </div>
                        <div class="relative z-10 max-w-2xl space-y-6">
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/30 text-amber-200 text-xs font-semibold backdrop-blur border border-amber-400/30">
                                <i class="fa-solid fa-moon"></i> Kurikulum Merdeka (SKI MTs)
                            </div>
                            <h1 class="text-4xl sm:text-5xl md:text-6xl font-black tracking-tight leading-tight text-white">
                                SEJARAH ISLAM <span class="text-amber-400">TTS CHALLENGE</span>
                            </h1>
                            <p class="text-lg text-brand-100 font-medium">
                                "Uji Pengetahuanmu. Pahami Sejarah. Teladani Tokoh Islam." Media pembelajaran interaktif berbasis gamifikasi untuk mapel SKI.

            let tokens = getActiveTokens();
            let found = tokens.find(t => t.token === tokenVal);
            let grade = found ? found.kelas : 7;
            let timerMin = found ? found.timer : 10;
            let materiFilter = found ? found.materi : 'Semua Materi';

        function buildNormalTTSPuzzle(grade, count, timerMin, materiFilter = 'Semua Materi', specificQuestionIds = null) {
            const allQuestions = getActiveQuestions();
            let filtered = allQuestions.filter(q => Number(q.kelas) === Number(grade));
            
            if (specificQuestionIds && specificQuestionIds.length > 0) {
                let manualFiltered = filtered.filter(q => specificQuestionIds.includes(q.id));
                if (manualFiltered.length > 0) filtered = manualFiltered;
            } else if (materiFilter && materiFilter !== 'Semua Materi') {
                let subFiltered = filtered.filter(q => q.materi === materiFilter);
                if (subFiltered.length >= 3) filtered = subFiltered;
            }

            let uniquePool = [];
            let seenAnswers = new Set();
            let seenQuestions = new Set();
            for (let q of filtered) {
                let cleanAns = (q.jawaban || '').replace(/[^A-Z]/g, '').toUpperCase();
                let cleanQ = (q.pertanyaan || '').trim().toLowerCase();
                if (cleanAns.length >= 2 && !seenAnswers.has(cleanAns) && !seenQuestions.has(cleanQ)) {
                    seenAnswers.add(cleanAns);
                    seenQuestions.add(cleanQ);
                    uniquePool.push({ ...q, jawaban: cleanAns });
                }
            }
            if (uniquePool.length < count) {
                for (let q of filtered) {
                    let cleanAns = (q.jawaban || '').replace(/[^A-Z]/g, '').toUpperCase();
                    if (cleanAns.length >= 2 && !seenAnswers.has(cleanAns)) {
                        seenAnswers.add(cleanAns);
                        uniquePool.push({ ...q, jawaban: cleanAns });
                    }
                }
            }
            uniquePool.sort(() => Math.random() - 0.5);

            let selectedQuestions = uniquePool.slice(0, count);
            const MAX_GRID = 70;
            let grid = Array(MAX_GRID).fill(0).map(() => Array(MAX_GRID).fill(''));
            let placedWords = [];
            let usedIds = new Set();

            if (selectedQuestions.length > 0) {
                let q0 = selectedQuestions[0];
                let word0 = q0.jawaban;
                let startR = Math.floor(MAX_GRID / 2);
                let startC = Math.floor(MAX_GRID / 2) - Math.floor(word0.length / 2);
                
                let coords0 = [];
                for(let i=0; i<word0.length; i++) {
                    grid[startR][startC + i] = word0[i];
                    coords0.push({r: startR, c: startC + i});
                }
                
                placedWords.push({ ...q0, word: word0, direction: 'mendatar', coords: coords0, number: 1 });
                usedIds.add(q0.id);
            }

            let questionNumberCounter = 2;
            let attempts = 0;

            while (placedWords.length < selectedQuestions.length && attempts < 1500) {
                attempts++;
                let bestFit = null;

                for (let q of selectedQuestions) {
                    if (usedIds.has(q.id)) continue;
                    let word = q.jawaban;

                    for (let pw of placedWords) {
                        for (let pIdx = 0; pIdx < pw.word.length; pIdx++) {
                            let targetChar = pw.word[pIdx];
                            let targetCoord = pw.coords[pIdx];

                            for (let wIdx = 0; wIdx < word.length; wIdx++) {
                                if (word[wIdx] === targetChar) {
                                    let newDir = pw.direction === 'mendatar' ? 'menurun' : 'mendatar';
                                    let startR_new = newDir === 'menurun' ? targetCoord.r - wIdx : targetCoord.r;
                                    let startC_new = newDir === 'mendatar' ? targetCoord.c - wIdx : targetCoord.c;

                                    if (canPlaceWordNormal(grid, word, startR_new, startC_new, newDir, MAX_GRID)) {
                                        bestFit = { q: q, word: word, dir: newDir, r: startR_new, c: startC_new };
                                        break;
                                    }
                                }
                            }
                            if (bestFit) break;
                        }
                        if (bestFit) break;
                    }
                    if (bestFit) break;
                }

                if (bestFit) {
                    let coords = [];
                    for(let k = 0; k < bestFit.word.length; k++) {
                        let rr = bestFit.dir === 'menurun' ? bestFit.r + k : bestFit.r;
                        let cc = bestFit.dir === 'mendatar' ? bestFit.c + k : bestFit.c;
                        grid[rr][cc] = bestFit.word[k];
                        coords.push({r: rr, c: cc});
                    }
                    placedWords.push({ ...bestFit.q, word: bestFit.word, direction: bestFit.dir, coords: coords, number: questionNumberCounter++ });
                    usedIds.add(bestFit.q.id);
                } else {
                    break;
                }
            }

            if (placedWords.length < selectedQuestions.length) {
                let unplaced = selectedQuestions.filter(q => !usedIds.has(q.id));
                let fallbackR = 2;
                unplaced.forEach(q => {
                    let word = q.jawaban;
                    let coords = [];
                    for (let k = 0; k < word.length; k++) {
                        if (fallbackR < MAX_GRID && k < MAX_GRID) {
                            grid[fallbackR][k] = word[k];
                            coords.push({r: fallbackR, c: k});
                        }
                    }
                    if (coords.length > 0) {
                        placedWords.push({ ...q, word: word, direction: 'mendatar', coords: coords, number: questionNumberCounter++ });
                        fallbackR += 3;
                    }
                });
            }

            let minR = MAX_GRID, maxR = 0, minC = MAX_GRID, maxC = 0;
            for (let r = 0; r < MAX_GRID; r++) {
                for (let c = 0; c < MAX_GRID; c++) {
                    if (grid[r][c] !== '') {
                        if (r < minR) minR = r;
                        if (r > maxR) maxR = r;
                        if (c < minC) minC = c;
                        if (c > maxC) maxC = c;
                    }
                }
            }

            minR = Math.max(0, minR - 1);
            maxR = Math.min(MAX_GRID - 1, maxR + 1);
            minC = Math.max(0, minC - 1);
            maxC = Math.min(MAX_GRID - 1, maxC + 1);

            let croppedRows = maxR - minR + 1;
            let croppedCols = maxC - minC + 1;
            let croppedGrid = Array(croppedRows).fill(0).map(() => Array(croppedCols).fill(''));

            for (let r = minR; r <= maxR; r++) {
                for (let c = minC; c <= maxC; c++) {
                    croppedGrid[r - minR][c - minC] = grid[r][c];
                }
            }

            placedWords.forEach(w => {
                w.coords = w.coords.map(coord => ({ r: coord.r - minR, c: coord.c - minC }));
            });

            let cellToNumberMap = {};
            let currentNum = 1;
            placedWords.sort((a, b) => a.coords[0].r - b.coords[0].r || a.coords[0].c - b.coords[0].c);
            
            placedWords.forEach(w => {
                let startKey = `${w.coords[0].r}_${w.coords[0].c}`;
                if (!cellToNumberMap[startKey]) cellToNumberMap[startKey] = currentNum++;
                w.number = cellToNumberMap[startKey];
            });

            State.activeGame = { grid: croppedGrid, gridRows: croppedRows, gridCols: croppedCols, words: placedWords };
            State.answersState = {};
            State.score = 0;
            State.hintsUsed = 0;
            State.remainingSeconds = timerMin * 60;
            State.startTime = new Date();
        }

        function canPlaceWordNormal(grid, word, startR, startC, direction, size) {
            for(let i=0; i<word.length; i++) {
                let r = direction === 'menurun' ? startR + i : startR;
                let c = direction === 'mendatar' ? startC + i : startC;
                if (r < 0 || r >= size || c < 0 || c >= size) return false;
                let current = grid[r][c];
                if (current !== '' && current !== word[i]) return false;

                if (direction === 'mendatar') {
                    if (current === '') {
                        if (r - 1 >= 0 && grid[r-1][c] !== '') return false;
                        if (r + 1 < size && grid[r+1][c] !== '') return false;
                    }
                    if (i === 0 && c - 1 >= 0 && grid[r][c-1] !== '') return false;
                    if (i === word.length - 1 && c + 1 < size && grid[r][c+1] !== '') return false;
                } else {
                    if (current === '') {
                        if (c - 1 >= 0 && grid[r][c-1] !== '') return false;
                        if (c + 1 < size && grid[r][c+1] !== '') return false;
                    }
                    if (i === 0 && r - 1 >= 0 && grid[r-1][c] !== '') return false;
                    if (i === word.length - 1 && r + 1 < size && grid[r+1][c] !== '') return false;
                }
            }
            return true;
        }

        function renderGameView() {
            return `
                <div class="space-y-6 w-full">
                    <div class="bg-white p-4 rounded-3xl shadow-md border border-brand-100 flex flex-wrap items-center justify-between gap-4">

                            <button onclick="finishGameConfirm()" class="px-5 py-3 bg-gradient-to-r from-brand-600 to-brand-700 hover:from-brand-700 hover:to-brand-800 text-white font-black rounded-2xl shadow-lg hover:shadow-brand-500/30 transition transform hover:-translate-y-0.5 text-sm flex items-center gap-2">

                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        <div class="lg:col-span-7 bg-white p-8 rounded-3xl shadow-sm border border-brand-100 flex flex-col items-center overflow-x-auto relative">

                                    <button onclick="useHint()" class="px-4 py-2 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-brand-900 rounded-2xl text-xs font-black transition flex items-center gap-2 shadow-md border border-amber-300">

                            <div id="ttsGridContainer" class="p-4 bg-brand-900/5 rounded-3xl border border-brand-100 inline-block shadow-inner backdrop-blur-sm max-h-[550px] overflow-auto"></div>
                            <p class="text-[11px] font-medium text-slate-500 mt-4 text-center">💡 Klik kotak untuk mengisi jawaban. Kotak akan menyala emas jika jawaban tokoh/sejarah benar!</p>

                        <div class="lg:col-span-5 space-y-6">
                            <div class="bg-white p-6 rounded-3xl shadow-sm border border-brand-100 max-h-72 overflow-y-auto">
                                <h3 class="font-black text-brand-900 text-sm mb-3 flex items-center gap-2 border-b border-brand-50 pb-3">
                                    <i class="fa-solid fa-arrow-right text-amber-500"></i> MENDATAR
                                </h3>
                                <div id="cluesMendatar" class="space-y-2.5 text-xs"></div>
                            </div>
                            <div class="bg-white p-6 rounded-3xl shadow-sm border border-brand-100 max-h-72 overflow-y-auto">
                                <h3 class="font-black text-brand-900 text-sm mb-3 flex items-center gap-2 border-b border-brand-50 pb-3">
                                    <i class="fa-solid fa-arrow-down text-emerald-500"></i> MENURUN

        function initGameEngine() {
            renderTTSBoard();
            renderClues();
            startTimer();
        }

        function renderTTSBoard() {
            const container = document.getElementById('ttsGridContainer');
            if (!container || !State.activeGame) return;
            const { grid, gridRows, gridCols, words } = State.activeGame;

            let cellLabels = {};
            words.forEach(w => {
                if (w.coords.length > 0) {
                    let startCoordKey = `${w.coords[0].r}_${w.coords[0].c}`;
                    if (!cellLabels[startCoordKey]) cellLabels[startCoordKey] = [];
                    cellLabels[startCoordKey].push(w.number);
                }
            });

            let html = '<table class="border-collapse"><tbody>';
            for (let r = 0; r < gridRows; r++) {
                html += '<tr>';
                for (let c = 0; c < gridCols; c++) {
                    let isLetter = grid[r][c] !== '';
                    if (isLetter) {
                        let key = `${r}_${c}`;
                        let val = State.answersState[key] || '';
                        let numbersAtCell = cellLabels[key];

                        let isCellCorrect = false;
                        words.forEach(w => {
                            let formed = '';
                            w.coords.forEach(coord => formed += (State.answersState[`${coord.r}_${coord.c}`] || ''));
                            if (formed === w.word && w.coords.some(coord => coord.r === r && coord.c === c)) isCellCorrect = true;
                        });

                        let cellBg = isCellCorrect 
                            ? 'bg-gradient-to-br from-amber-100 to-amber-200 border-amber-500 text-amber-900 shadow-md animate-correct' 
                            : val !== '' 
                                ? 'bg-brand-50 border-brand-400 text-brand-900 shadow-sm' 
                                : 'bg-white border-slate-200 hover:border-brand-300 text-slate-900 shadow-sm';

                        html += `<td id="td_${r}_${c}" class="relative border ${cellBg} tts-cell rounded-lg transition-all duration-200 hover:scale-105" onclick="selectCell(${r}, ${c})">`;
                        if (numbersAtCell) html += `<span class="absolute top-1 left-1 text-[9px] font-black text-brand-700 bg-brand-100/90 px-1 py-0.5 rounded shadow-sm leading-none pointer-events-none z-10">${numbersAtCell.join(',')}</span>`;
                        html += `<input type="text" maxlength="1" id="cell_${r}_${c}" value="${val}" oninput="handleCellInput(event, ${r}, ${c})" onkeydown="handleCellKeydown(event, ${r}, ${c})" class="w-full h-full pt-2 text-center uppercase bg-transparent font-black focus:outline-none focus:bg-amber-50 rounded-lg text-brand-900">`;
                        html += `</td>`;
                    } else {
                        html += `<td class="tts-cell bg-brand-900/10 border border-brand-900/10 rounded-md"></td>`;
                    }
                }
                html += '</tr>';
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderClues() {
            const mendatarEl = document.getElementById('cluesMendatar');
            const menurunEl = document.getElementById('cluesMenurun');
            if (!mendatarEl || !menurunEl || !State.activeGame) return;
            const { words } = State.activeGame;

            let mendatarHtml = '';
            let menurunHtml = '';

            words.forEach(w => {
                let formed = '';
                w.coords.forEach(coord => formed += (State.answersState[`${coord.r}_${coord.c}`] || ''));
                let isComplete = formed === w.word;
                let letterCount = w.word.length;

                let text = `<div id="clue_${w.number}" class="p-3 rounded-2xl transition border ${isComplete ? 'bg-amber-50/80 border-amber-300 text-amber-900 font-bold shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-brand-50 hover:border-brand-200 cursor-pointer shadow-sm'}" onclick="focusWord(${w.number})">
                    <div class="flex items-center justify-between">
                        <span class="font-black text-brand-700">${w.number}. <span class="text-[11px] font-semibold text-slate-500">(${letterCount} huruf)</span></span>
                        ${isComplete ? '<span class="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-bold shadow-xs">✓ Benar</span>' : ''}
                    </div>
                    <p class="mt-1 leading-relaxed">${w.pertanyaan}</p>
                </div>`;
                if (w.direction === 'mendatar') mendatarHtml += text;
                else menurunHtml += text;
            });

            mendatarEl.innerHTML = mendatarHtml || '<p class="text-slate-400 italic">Tidak ada soal mendatar.</p>';
            menurunEl.innerHTML = menurunHtml || '<p class="text-slate-400 italic">Tidak ada soal menurun.</p>';
        }

        function updateGameUI() {
            if (!State.activeGame) return;
            const { gridRows, gridCols, words } = State.activeGame;

            let correctCells = new Set();
            words.forEach(w => {
                let formed = '';
                w.coords.forEach(coord => formed += (State.answersState[`${coord.r}_${coord.c}`] || ''));
                let isComplete = formed === w.word;
                
                if (isComplete) {
                    w.coords.forEach(coord => correctCells.add(`${coord.r}_${coord.c}`));
                }

                let clueEl = document.getElementById(`clue_${w.number}`);
                if (clueEl) {
                    clueEl.className = `p-3 rounded-2xl transition border ${isComplete ? 'bg-amber-50/80 border-amber-300 text-amber-900 font-bold shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-brand-50 hover:border-brand-200 cursor-pointer shadow-sm'}`;
                    let headerEl = clueEl.querySelector('.flex.items-center.justify-between');
                    if (headerEl) {
                        let letterCount = w.word.length;
                        headerEl.innerHTML = `
                            <span class="font-black text-brand-700">${w.number}. <span class="text-[11px] font-semibold text-slate-500">(${letterCount} huruf)</span></span>
                            ${isComplete ? '<span class="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-bold shadow-xs">✓ Benar</span>' : ''}
                        `;
                    }
                }
            });

            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    let tdEl = document.getElementById(`td_${r}_${c}`);
                    let inputEl = document.getElementById(`cell_${r}_${c}`);
                    if (!tdEl || !inputEl) continue;

                    let key = `${r}_${c}`;
                    let val = State.answersState[key] || '';
                    let isCellCorrect = correctCells.has(key);

                    if (inputEl.value !== val) inputEl.value = val;

                    let cellBg = isCellCorrect 
                        ? 'bg-gradient-to-br from-amber-100 to-amber-200 border-amber-500 text-amber-900 shadow-md animate-correct' 
                        : val !== '' 
                            ? 'bg-brand-50 border-brand-400 text-brand-900 shadow-sm' 
                            : 'bg-white border-slate-200 hover:border-brand-300 text-slate-900 shadow-sm';

                    tdEl.className = `relative border ${cellBg} tts-cell rounded-lg transition-all duration-200 hover:scale-105`;
                }
            }
        }

        function selectCell(r, c) {
            let el = document.getElementById(`cell_${r}_${c}`);
            if (el) el.focus({ preventScroll: true });
        }

        function handleCellKeydown(e, r, c) {
            if (e.key === 'Backspace') {
                let key = `${r}_${c}`;
                if (!State.answersState[key] && c - 1 >= 0 && State.activeGame.grid[r][c-1] !== '') selectCell(r, c - 1);
            } else if (e.key === 'ArrowRight' && c + 1 < State.activeGame.gridCols && State.activeGame.grid[r][c+1] !== '') selectCell(r, c + 1);
            else if (e.key === 'ArrowLeft' && c - 1 >= 0 && State.activeGame.grid[r][c-1] !== '') selectCell(r, c - 1);
            else if (e.key === 'ArrowDown' && r + 1 < State.activeGame.gridRows && State.activeGame.grid[r+1][c] !== '') selectCell(r + 1, c);
            else if (e.key === 'ArrowUp' && r - 1 >= 0 && State.activeGame.grid[r-1][c] !== '') selectCell(r - 1, c);
        }

        function handleCellInput(e, r, c) {
            let val = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
            e.target.value = val;
            let key = `${r}_${c}`;
            let prevVal = State.answersState[key];
            State.answersState[key] = val;

            if (val && !prevVal) {
                e.target.classList.add('animate-pop');
                setTimeout(() => e.target.classList.remove('animate-pop'), 300);
            }

            let correctCount = 0;
            State.activeGame.words.forEach(w => {
                let formed = '';
                w.coords.forEach(coord => formed += (State.answersState[`${coord.r}_${coord.c}`] || ''));
                if (formed === w.word) correctCount++;
            });

            State.score = correctCount * 100 - (State.hintsUsed * 25);
            if (State.score < 0) State.score = 0;
            const scoreEl = document.getElementById('scoreDisplay');
            if (scoreEl) {
                scoreEl.innerText = State.score;
                scoreEl.classList.add('scale-125', 'text-amber-500');
                setTimeout(() => scoreEl.classList.remove('scale-125', 'text-amber-500'), 250);
            }

            updateGameUI();

            if (val && c + 1 < State.activeGame.gridCols && State.activeGame.grid[r][c+1] !== '') selectCell(r, c + 1);
        }

        function focusWord(num) {
            let wordObj = State.activeGame.words.find(w => w.number === num);
            if (wordObj && wordObj.coords.length > 0) selectCell(wordObj.coords[0].r, wordObj.coords[0].c);
        }

        function useHint() {
            if (State.hintsUsed >= 3) {
                alertBox("Batas Bantuan", "Kamu sudah menggunakan semua bantuan (hint)!");
                return;
            }
            let unassignedWords = State.activeGame.words.filter(w => {
                let formed = '';
                w.coords.forEach(coord => formed += (State.answersState[`${coord.r}_${coord.c}`] || ''));
                return formed !== w.word;
            });

            if (unassignedWords.length === 0) {
                alertBox("Selesai", "Semua kata sudah terisi dengan benar!");
                return;
            }

            let targetWord = unassignedWords[0];
            let firstCoord = targetWord.coords[0];
            State.answersState[`${firstCoord.r}_${firstCoord.c}`] = targetWord.word[0];
            State.hintsUsed++;
            document.getElementById('hintCount').innerText = 3 - State.hintsUsed;
            
            updateGameUI();
            
            alertBox("💡 Bantuan Tokoh/Peristiwa", `Huruf pertama untuk pertanyaan nomor ${targetWord.number} adalah "${targetWord.word[0]}". (Nilai dikurangi 25 Poin)`);
        }

        function startTimer() {
            if (State.timerInterval) clearInterval(State.timerInterval);
            State.timerInterval = setInterval(() => {
                State.remainingSeconds--;
                let m = Math.floor(State.remainingSeconds / 60);
                let s = State.remainingSeconds % 60;
                let display = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                let timerEl = document.getElementById('timerDisplay');
                if (timerEl) timerEl.innerText = display;

                if (State.remainingSeconds <= 0) {
                    clearInterval(State.timerInterval);
                    alertBox("Waktu Habis!", "Waktu kuis telah habis. Mari lihat hasil pencapaianmu.");
                    finishGame();
                }
            }, 1000);
        }

        function confirmBox(title, message, onConfirmCallback) {
            let modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-brand-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-pop";
            modal.innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full space-y-4 text-center border border-brand-100">
                    <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-2xl shadow-inner">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <h3 class="font-bold text-lg text-brand-900">${title}</h3>
                    <p class="text-sm text-slate-600">${message}</p>
                    <div class="flex gap-3 pt-4">
                        <button id="btnCancelBox" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition shadow border">Batal</button>
                        <button id="btnConfirmBox" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl transition shadow">Ya, Yakin</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('btnCancelBox').onclick = () => modal.remove();
            document.getElementById('btnConfirmBox').onclick = () => { modal.remove(); onConfirmCallback(); };
        }

        function finishGameConfirm() {
            let belumTerjawab = 0;
            State.activeGame.words.forEach(w => {
                let wordFormed = '';
                w.coords.forEach(coord => wordFormed += (State.answersState[`${coord.r}_${coord.c}`] || ''));
                if (wordFormed !== w.word) belumTerjawab++;
            });

            let title = "Akhiri Ujian?";
            let msg = "Apakah kamu yakin ingin mengakhiri sesi ini dan melihat hasil nilai sejarahmu?";
            if (belumTerjawab > 0) {
                let m = Math.floor(State.remainingSeconds / 60);
                let s = State.remainingSeconds % 60;
                let waktuSisa = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                msg = `Masih ada <strong class="text-rose-600">${belumTerjawab} soal</strong> yang kosong atau keliru. Sisa waktu: <strong>${waktuSisa}</strong>.<br><br>Akhiri sekarang?`;
            }
            confirmBox(title, msg, finishGame);
        }

        async function finishGame() {
            if (State.timerInterval) clearInterval(State.timerInterval);
            State.endTime = new Date();

            let correct = 0, wrong = 0, details = [];
            State.activeGame.words.forEach(w => {
                let wordFormed = '';
                w.coords.forEach(coord => wordFormed += (State.answersState[`${coord.r}_${coord.c}`] || ''));
                let isCorrect = wordFormed === w.word;
                if (isCorrect) correct++; else wrong++;
                details.push({ question: w.pertanyaan, answer: w.word, explanation: w.penjelasan, userAnswer: wordFormed, isCorrect });
            });

            let totalWords = State.activeGame.words.length;
            let accuracy = Math.round((correct / totalWords) * 100);
            let finalScore = (correct * 100) - (State.hintsUsed * 25);
            if (finalScore < 0) finalScore = 0;

            let badge = "🥉 PELAJAR SEJARAH";
            if (finalScore >= 1200) badge = "🏆 SEJARAWAN MUSLIM";
            else if (finalScore >= 950) badge = "🥇 PENGAMAT SEJARAH";
            else if (finalScore >= 700) badge = "🥈 PENJELAJAH WAKTU";

            let resultRecord = {
                id: 'RES-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
                name: State.gameConfig.studentName || 'Siswa Mandiri',
                class: State.gameConfig.studentClass || 'VII-A',
                score: finalScore,
                correct: correct,
                wrong: wrong,
                total: totalWords,
                accuracy: accuracy,
                badge: badge,
                timeSpent: Math.floor((State.endTime - State.startTime) / 1000),
                date: new Date().toLocaleDateString('id-ID'),
                details: details
            };

            await syncSave('results', resultRecord.id, resultRecord);
            State.lastResult = resultRecord;
            router.navigate('result');
        }

        window.updateTokenQuestionPreview = function() {
            let grade = document.getElementById('tKelas')?.value || 7;
            let materi = document.getElementById('tokenMateriSelect')?.value || 'Semua Materi';
            let count = parseInt(document.getElementById('tSoal')?.value) || 10;
            let allQuestions = getActiveQuestions();
            let filtered = allQuestions.filter(q => Number(q.kelas) === Number(grade));
            if (materi && materi !== 'Semua Materi') {
                let subFiltered = filtered.filter(q => q.materi === materi);
                if (subFiltered.length >= 3) filtered = subFiltered;
            }
            
            let uniquePool = [];
            let seenAnswers = new Set();
            let seenQuestions = new Set();
            for (let q of filtered) {
                let cleanAns = (q.jawaban || '').replace(/[^A-Z]/g, '').toUpperCase();
                let cleanQ = (q.pertanyaan || '').trim().toLowerCase();
                if (cleanAns.length >= 2 && !seenAnswers.has(cleanAns) && !seenQuestions.has(cleanQ)) {
                    seenAnswers.add(cleanAns);
                    seenQuestions.add(cleanQ);
                    uniquePool.push(q);
                }
            }
            uniquePool.sort(() => Math.random() - 0.5);
            let previewItems = uniquePool.slice(0, count);
            
            window._tempTokenQuestions = previewItems.map(q => q.id);
            
            let previewListEl = document.getElementById('tokenQuestionPreviewList');
            if (!previewListEl) return;
            previewListEl.innerHTML = previewItems.map((q, i) => `
                <div class="p-2 bg-white rounded-xl border flex items-center justify-between">
                    <span class="font-bold text-brand-900 truncate pr-2">${i+1}. ${q.pertanyaan}</span>
                    <span class="font-mono bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">${q.jawaban}</span>
                </div>
            `).join('');
        };

        window.previewTokenQuestions = function(tokenCode) {
            let tokens = getActiveTokens();
            let t = tokens.find(item => item.token === tokenCode);
            if (!t) return;
            
            let allQuestions = getActiveQuestions();
            let previewItems = [];
            
            if (t.questionIds && t.questionIds.length > 0) {
                 previewItems = allQuestions.filter(q => t.questionIds.includes(q.id));
            } else {
                let filtered = allQuestions.filter(q => Number(q.kelas) === Number(t.kelas));
                if (t.materi && t.materi !== 'Semua Materi') {
                    let subFiltered = filtered.filter(q => q.materi === t.materi);
                    if (subFiltered.length >= 3) filtered = subFiltered;
                }
                previewItems = filtered.slice(0, t.soalCount || 10);
            }
            
            let modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-brand-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4";
            modal.innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-lg w-full space-y-4 border border-brand-100 max-h-[80vh] overflow-y-auto">
                    <div class="flex items-center justify-between border-b border-brand-50 pb-3">
                        <h3 class="font-black text-brand-900 text-base">Detail Token SKI: <span class="text-amber-500">${t.token}</span></h3>
                        <button onclick="this.closest('.fixed').remove()" class="text-slate-400 hover:text-slate-700 font-bold"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <div class="space-y-2 pt-2">
                        ${previewItems.map((q, idx) => `
                            <div class="p-3 bg-brand-50 rounded-2xl border border-brand-100 text-xs space-y-1">
                                <div class="flex justify-between font-bold text-brand-700">
                                    <span>No. ${idx+1} (${q.materi})</span>
                                    <span class="font-mono text-amber-700 bg-amber-100 px-2 py-0.5 rounded">${q.jawaban}</span>
                                </div>
                                <p class="text-brand-900 font-semibold">${q.pertanyaan}</p>
                            </div>
                        `).join('')}
                    </div>
                    <div class="pt-2 text-right">
                        <button onclick="this.closest('.fixed').remove()" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-xs">Tutup Pratinjau</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.saveGameToken = async function(e) {
            e.preventDefault();
            let tokenCode = document.getElementById('tCode').value.trim().toUpperCase();
            let newToken = {
                title: document.getElementById('tTitle').value.trim(),
                token: tokenCode,
                kelas: parseInt(document.getElementById('tKelas').value) || 7,
                materi: document.getElementById('tokenMateriSelect').value,
                soalCount: parseInt(document.getElementById('tSoal').value) || 10,
                timer: parseInt(document.getElementById('tTimer').value) || 10,
                questionIds: window._tempTokenQuestions || []
            };
            await syncSave('tokens', tokenCode, newToken);
            document.querySelector('.fixed').remove();
            router.navigate('teacherDashboard');
            alertBox("Sukses", "Token ujian sejarah berhasil diterbitkan ke Cloud.");
        };

        window.deleteGameToken = async function(token) {
            confirmBox("Tarik Token?", `Yakin ingin menghapus token "${token}"?`, async () => {
                await syncDelete('tokens', token);
                router.navigate('teacherDashboard');
            });
        };

        window.deleteResultRecord = async function(id) {
            confirmBox("Hapus Nilai?", "Hapus riwayat nilai siswa ini?", async () => {
                await syncDelete('results', id);
                router.navigate('teacherDashboard');
            });
        };

        window.clearAllResults = async function() {
            confirmBox("Kosongkan Semua Nilai?", "Menghapus permanen seluruh riwayat skor SKI dari sistem. Yakin?", async () => {
                if (window.firebaseDb && window.firebaseHelpers) {
                    let currentRes = getActiveResults();
                    for (let r of currentRes) {
                        if (r.id) {
                            const docRef = window.firebaseHelpers.doc(window.firebaseDb, `ski_results`, r.id);
                            await window.firebaseHelpers.deleteDoc(docRef).catch(e=>console.log(e));
                        }
                    }
                }
                
                State.cloudResults = [];
                localStorage.removeItem('ski_tts_results_fb');
                router.navigate('teacherDashboard');
            });
        };

        window.openUserModal = function() {
            let modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-brand-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4";
            modal.innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full space-y-6 border border-brand-100">
                    <h3 class="font-black text-brand-900 text-lg">Akun Guru Baru</h3>
                    <form onsubmit="saveUserAccount(event)" class="space-y-4 text-xs font-semibold text-brand-800">
                        <div>
                            <label class="block mb-1">Nama / Gelar</label>
                            <input type="text" id="uName" required placeholder="Bapak Budi" class="w-full p-2.5 rounded-xl border focus:ring-2 focus:ring-brand-500">
                        </div>
                        <div>
                            <label class="block mb-1">Username Login</label>
                            <input type="text" id="uUser" required placeholder="budi_ski" class="w-full p-2.5 rounded-xl border font-mono focus:ring-2 focus:ring-brand-500">
                        </div>
                        <div>
                            <label class="block mb-1">Kata Sandi (Password)</label>
                            <input type="password" id="uPass" required placeholder="Buat password" class="w-full p-2.5 rounded-xl border focus:ring-2 focus:ring-brand-500">
                        </div>
                        <div class="pt-4 flex gap-3 justify-end">
                            <button type="button" onclick="this.closest('.fixed').remove()" class="px-4 py-2.5 bg-slate-100 border text-slate-700 font-bold rounded-xl">Batal</button>
                            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow">Tambahkan</button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.openChangePasswordModal = function(username) {
            let modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-brand-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4";
            modal.innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full space-y-6 border border-brand-100">
                    <h3 class="font-black text-brand-900 text-lg">Ganti Sandi Akun: <br><span class="text-amber-500 font-mono text-sm">${username}</span></h3>
                    <form onsubmit="saveNewPassword(event, '${username}')" class="space-y-4 text-xs font-semibold text-brand-800">
                        <div>
                            <label class="block mb-1">Password Baru</label>
                            <input type="password" id="newPass" required placeholder="Masukkan kata sandi baru" class="w-full p-2.5 rounded-xl border focus:ring-2 focus:ring-brand-500">
                        </div>
                        <div class="pt-4 flex gap-3 justify-end">
                            <button type="button" onclick="this.closest('.fixed').remove()" class="px-4 py-2.5 bg-slate-100 border text-slate-700 font-bold rounded-xl">Batal</button>
                            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow">Terapkan</button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.saveNewPassword = async function(e, username) {
            e.preventDefault();
            let newPass = document.getElementById('newPass').value.trim();
            let users = getActiveUsers();
            let u = users.find(item => item.username === username);
            if (u) {
                u.password = newPass;
                await syncSave('users', username, u);
                document.querySelector('.fixed').remove();
                router.navigate('teacherDashboard');
                alertBox("Selesai", "Kata sandi akun guru telah diperbarui.");
            }
        };

        window.saveUserAccount = async function(e) {
            e.preventDefault();
            let username = document.getElementById('uUser').value.trim();
            if(getActiveUsers().find(u => u.username === username)) {
                alertBox("Gagal", "Username sudah dipakai.");
                return;
            }
            let newUser = {
                name: document.getElementById('uName').value.trim(),
                username: username,
                password: document.getElementById('uPass').value.trim(),
                role: 'teacher'
            };
            await syncSave('users', username, newUser);
            document.querySelector('.fixed').remove();
            router.navigate('teacherDashboard');
            alertBox("Sukses", "Akun pengajar SKI baru aktif.");
        };

        window.deleteUser = async function(username) {
            confirmBox("Cabut Akses?", `Hapus akun "${username}"?`, async () => {
                await syncDelete('users', username);
                router.navigate('teacherDashboard');
            });
        };

        function alertBox(title, message) {
            let modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-brand-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-pop";
            modal.innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full space-y-4 text-center border border-brand-100">
                    <h3 class="font-bold text-lg text-brand-900">${title}</h3>
                    <p class="text-sm text-slate-600">${message}</p>
                    <button onclick="this.closest('.fixed').remove()" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl transition shadow">OK / Paham</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        window.router = router;
        window.selectCell = selectCell;
        window.handleCellInput = handleCellInput;
        window.handleCellKeydown = handleCellKeydown;
        window.focusWord = focusWord;
        window.useHint = useHint;
        window.finishGameConfirm = finishGameConfirm;
        window.handleTeacherLogin = handleTeacherLogin;
        window.updateTokenMaterialsAndPreview = updateTokenMaterialsAndPreview;
        window.updateTokenQuestionPreview = updateTokenQuestionPreview;
        window.previewTokenQuestions = previewTokenQuestions;
        window.updateModalMaterials = updateModalMaterials;
        window.onTokenSelectChange = onTokenSelectChange;
        window.filterAdminResults = filterAdminResults;

        window.onload = function() {
            renderApp();
            loadDataFromFirebase();
        };
    </script>
</body>
</html>
